name: Check website and Docker image
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        env:
          SITE_URL: https://example.com
        run: |
          python3 scripts/check.py
          docker compose config --quiet
          docker compose build
          docker compose up -d
      - name: Verify served pages and assets
        run: |
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 1
          done
          python3 scripts/check_http.py http://127.0.0.1:18081
      - name: Show logs and clean up this project
        if: always()
        env:
          SITE_URL: https://example.com
        run: |
          docker compose logs
          docker compose down
